<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14304a">
<title>Tchau Papel FBC 2.0</title>
<style>
:root{
  --bg:#f2f4f7;--card:#fff;--ink:#1b2733;--mut:#5e6b78;--line:#dde2e8;
  --brand:#14304a;--brand2:#1f5d8c;--on-brand:#fff;
  --ok:#1d7a46;--okbg:#e4f4ea;--warn:#a8590a;--warnbg:#fff1dc;--bad:#b3261e;--badbg:#fde8e6;
  --seg:#b3261e;--segbg:#fde8e6;--ci:#a8590a;--cibg:#fff1dc;
  --sel:#e3effa;--shadow:0 1px 2px rgba(20,48,74,.12),0 4px 14px rgba(20,48,74,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1720;--card:#18232f;--ink:#e8edf2;--mut:#9aa8b5;--line:#2a3846;
  --brand:#0b1722;--brand2:#5aa6de;--okbg:#14301f;--warnbg:#3a2a10;--badbg:#3b1815;
  --segbg:#3b1815;--cibg:#3a2a10;--sel:#183247;--ok:#6fd49a;--warn:#f2b564;--bad:#ff9a92;--seg:#ff9a92;--ci:#f2b564;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
header.top{background:var(--brand);color:var(--on-brand);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;font-weight:650;flex:1;letter-spacing:.2px}
.topw{position:sticky;top:0;z-index:20}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.16);white-space:nowrap}
.chip.warn{background:#ffd9a0;color:#5a2d00}
main{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:14px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:650}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.small{font-size:13px}.tiny{font-size:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600}
.btn.pri{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.dng{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.banner.ok{background:var(--okbg);color:var(--ok)}.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.bad{background:var(--badbg);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--bg);border-radius:10px;padding:10px 6px;text-align:center;min-width:0;font-size:13px;overflow-wrap:anywhere}
.kpi b{display:block;font-size:22px}
/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);max-width:760px;margin:0 auto}
nav.bottom button{flex:1;min-width:0;border:0;background:none;padding:9px 1px 8px;font-size:11px;color:var(--mut);position:relative;font-weight:600}
nav.bottom button svg{display:block;margin:0 auto 2px;width:22px;height:22px}
nav.bottom button.on{color:var(--brand2)}
nav.bottom .bdg{position:absolute;top:3px;left:55%;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;min-width:18px;padding:0 5px;line-height:18px}
/* filtros */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msel{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:44px;padding:8px 12px;border:1px solid var(--line,#c8ccd0);border-radius:10px;background:var(--card,#fff);text-align:left;min-width:0}
.msel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.msel.on{border-color:var(--brand);font-weight:600}
.updbar{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:15px;font-weight:600}
.updbar.warn{background:#ffb400;color:#2b1d00}.updbar.ok{background:var(--okbg);color:var(--ok);font-size:13px;font-weight:500;padding:5px 14px}
.updbar .grow{flex:1}.updbar button{border:0;border-radius:99px;padding:8px 16px;font-weight:700;background:#2b1d00;color:#fff}.updbar.ok button{background:transparent;color:inherit;text-decoration:underline;padding:2px 4px;font-weight:500}
.login{max-width:380px;margin:0 auto;padding:40px 20px}.login input{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #c8ccd0;border-radius:10px}
.filters .full{grid-column:1/-1}
select,input[type=text],input[type=search],input[type=date],input[type=time],textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;min-height:42px;font-size:15px}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 2px}
.tools label{display:flex;align-items:center;gap:8px;font-weight:600}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand2);flex:none}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:14px}
/* lista */
.pat{margin:16px 2px 6px;font-weight:700;font-size:15px;display:flex;gap:8px;align-items:baseline}
.pat span{font-weight:500;color:var(--mut);font-size:13px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.grp>.gh{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.gh b{font-size:15px}
.os{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 90px;border-left:5px solid transparent}
.gh+.os{border-top:0}
.os.seg{border-left-color:var(--seg);background:linear-gradient(90deg,var(--segbg),transparent 60%)}
.os.ci:not(.seg){border-left-color:var(--ci);background:linear-gradient(90deg,var(--cibg),transparent 60%)}
.os.sel{background:var(--sel)}
.os.done{opacity:.55}
.os .b{flex:1;min-width:0}
.os .eq{font-weight:650;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--line);margin:0 4px 2px 0;vertical-align:1px}
.tag.seg{background:var(--segbg);color:var(--seg);border-color:var(--seg)}
.tag.ci{background:var(--cibg);color:var(--ci);border-color:var(--ci)}
.os .meta{font-size:13px;color:var(--mut);margin-top:2px}
.os .desc{font-size:14px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.os .desc.open{-webkit-line-clamp:unset;display:block}
.os .code{font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--mut);margin-top:3px;overflow-wrap:anywhere}
.nr{display:flex;flex-direction:column;gap:6px;flex:none}
.nr button{min-width:62px;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;padding:4px 6px}
.nr button.on{background:var(--warn);border-color:var(--warn);color:#fff}
.nr button[disabled]{opacity:.35}
.status{font-size:13px;font-weight:600;margin-top:4px;color:var(--ok)}
/* barra seleção */
.selbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:25;max-width:760px;margin:0 auto;padding:8px 12px}
.selbar .in{background:var(--brand);color:#fff;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.selbar .in .btn{color:var(--ink)}
.selbar .btn.pri{color:#fff;background:var(--brand2)}
/* sheet / modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,20,30,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 12px 24px}
.sheet.full{height:94vh}
.sheet .sh{position:sticky;top:0;background:var(--bg);padding:14px 2px 8px;display:flex;align-items:center;gap:8px;z-index:2}
.sheet .sh h3{margin:0;flex:1;font-size:18px}
.dlg{background:var(--card);border-radius:16px;padding:18px;margin:16px;max-width:460px;width:100%;align-self:center}
.dlg ul{padding-left:20px;margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px}
table.rt{width:100%;border-collapse:collapse;font-size:14px}
table.rt td,table.rt th{padding:8px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.rt th{font-size:12px;color:var(--mut);text-transform:uppercase}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.new{background:var(--warnbg);color:var(--warn)}.pill.sent{background:var(--okbg);color:var(--ok)}.pill.ed{background:var(--badbg);color:var(--bad)}
.team{display:flex;flex-wrap:wrap;gap:6px}
.team label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--card);padding:10px 12px;border-radius:10px;width:100%}
.team label.on{background:var(--sel);border-color:var(--brand2)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(130px + env(safe-area-inset-bottom));z-index:70;max-width:560px;margin:0 auto;background:#1b2733;color:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.toast button{background:none;border:0;color:#9fd0ff;font-weight:700}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.mrow{display:flex;gap:6px;align-items:center;font-size:13px;margin-top:4px}

.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mbtn{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px 12px;text-align:left;box-shadow:var(--shadow);min-height:120px;display:flex;flex-direction:column;gap:6px}
.mbtn svg{width:30px;height:30px;color:var(--brand2)}
.mbtn b{font-size:16px}.mbtn span{font-size:13px;color:var(--mut)}
.mbtn.soon{opacity:.6}
.mbtn .pill{align-self:flex-start}
.pill.soon{background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.bar{height:14px;border-radius:7px;background:var(--bg);overflow:hidden;display:flex;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.bar .d{background:#2e9d5f}.bar .p{background:#e8a22b}
.bar.sm{height:9px}
.arow{padding:10px 0;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cbtn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;min-height:30px}
.cbtn.seg.has{border-color:var(--seg);color:var(--seg);background:var(--segbg)}
.cbtn.ci.has{border-color:var(--ci);color:var(--ci);background:var(--cibg)}
.cbtn.on{outline:2px solid var(--brand2)}
.plist{margin-top:8px;border-left:3px solid var(--line);padding-left:10px}
.plist .it{padding:6px 0;border-top:1px dashed var(--line);font-size:13px}
.plist .it:first-child{border-top:0}
.donutw{display:flex;align-items:center;gap:14px}
.sdesc{font-size:13px;margin-top:3px}

.tag.lt{background:var(--sel);border-color:var(--brand2);color:var(--brand2)}
.tag.lt.obr{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.qopt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qopt button{min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-weight:700;font-size:15px}
.qopt button.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.qopt button.on.sim{background:var(--warn);border-color:var(--warn)}
.cnt{font-size:12px;color:var(--mut);text-align:right}
.lrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="toast"></div>

function parseAtv(a){
  const m = /^(T_)?EE_(INS|MAN)_(CONF|SEG)_(S|C)_I_(.*?)(?:_(\d+))?$/.exec(a||'');
  if(!m) return {raw:a, equip:a||'', ok:false};

}

function openMulti(k){ // seletor com vários itens (pátios / localidades)
  const patios = [...new Set(B.os.map(o=>o.patio))].sort((a,b)=>patioIdx(a)-patioIdx(b));
  const locs = [...new Set(B.os.filter(o=>!S.f.patios.length||S.f.patios.includes(o.patio)).map(o=>o.loc))].sort(cmp);
  const lista = k==='patios' ? patios : locs, titulo = k==='patios' ? 'Pátios' : 'Localidades';
  const sel = new Set(S.f[k]);
  const ov = document.createElement('div'); ov.className='ov'; ov.style.zIndex=80;
  ov.innerHTML = `<div class="sheet"><div class="sh"><h3>${titulo}</h3><button class="btn sm" data-mc>Limpar</button><button class="btn sm pri" data-mo>Aplicar</button></div>
    <div class="team">${lista.map(p=>`<label class="${sel.has(p)?'on':''}"><input type="checkbox" value="${esc(p)}" ${sel.has(p)?'checked':''}><span class="grow"><b>${esc(p)}</b></span></label>`).join('')||'<div class="empty">Nada para escolher.</div>'}</div></div>`;
  document.body.appendChild(ov);
  ov.onclick = e => {
    if(e.target===ov){ ov.remove(); return; }
    if(e.target.closest('[data-mc]')){ ov.querySelectorAll('input').forEach(i=>{ i.checked=false; i.closest('label').classList.remove('on'); }); return; }
    if(e.target.closest('[data-mo]')){

      if(k==='patios') S.f.locs = [];
      save(); ov.remove(); viewOrdens(); return; }
    const lab = e.target.closest('label'); if(lab) setTimeout(()=>lab.classList.toggle('on', lab.querySelector('input').checked),0);
  };
}
function viewOrdens(){
  const v = $('#view');
  const patios = [...new Set(B.os.map(o=>o.patio))].sort((a,b)=>patioIdx(a)-patioIdx(b));

function filtered(){

    .sort((a,b)=>patioIdx(a.patio)-patioIdx(b.patio)||cmp(a.ativo,b.ativo)||cmp(a.atv,b.atv));

function updateLista(){
  const st = statusMap();
  let list = filtered();
  const total = list.length;
  if(S.ui.ocultar) list = list.filter(o=>!st.has(o.id));
  const selSet = new Set(S.sel);

  const groups = [];
  for(const o of list){
    let g = groups[groups.length-1];
    if(!g || g.ativo!==o.ativo || g.patio!==o.patio){ g = {patio:o.patio, ativo:o.ativo, loc:o.loc, items:[]}; groups.push(g); }
    g.items.push(o);
  }
  const patCount = {}; for(const g of groups) patCount[g.patio]=(patCount[g.patio]||0)+g.items.length;
  for(const g of groups){
    if(g.patio!==lastP){ html += `<div class="pat">${esc(g.patio)} <span>${patCount[g.patio]} OS</span></div>`; lastP=g.patio; }
    const selectable = g.items.filter(o=>!st.has(o.id));

    html += `<div class="grp"><div class="gh"><input type="checkbox" data-act="selAtivo" data-ativo="${esc(g.ativo)}" data-patio="${esc(g.patio)}" ${allSel?'checked':''} ${selectable.length?'':'disabled'} aria-label="Selecionar todas as OS do ativo"><div class="grow"><b>${esc(g.ativo)}</b> <span class="tag">${esc(g.loc)}</span></div><span class="tiny mut">${g.items.length} OS</span></div>`;
    for(const o of g.items) html += osRow(o, st.get(o.id), selSet.has(o.id));
    html += `</div>`;
  }
  $('#lista').innerHTML = html || `<div class="empty">Nenhuma OS encontrada com esses filtros.</div>`;
  const sel = list.filter(o=>!st.has(o.id));
  const sa = $('#selAll');
  if(sa){ const n = sel.filter(o=>selSet.has(o.id)).length; sa.checked = sel.length>0 && n===sel.length; sa.indeterminate = n>0 && n<sel.length; sa.disabled = !sel.length; }
  const c = $('#count'); if(c) c.textContent = `${total} OS · ${sel.length} livres`;
  renderSelBar();
}
function osRow(o, stt, sel){

  const nrOn = t => stt && stt.k==='nrav' && stt.n.tipo===t;

    <input type="checkbox" data-act="sel" data-id="${esc(o.id)}" ${sel?'checked':''} ${done?'disabled':''} aria-label="Selecionar OS ${esc(o.id)}">
    <div class="b"><div class="eq">${esc(a.ok?a.equip:o.atv)}</div><div>${tags}</div><div class="meta">OS <b>${esc(o.id)}</b>${S.ui.det?'':' · '+fmtHM(o.tmin)}</div>${det}${status}</div>
    <div class="nr"><button class="${nrOn('NRAV')?'on':''}" data-act="nr" data-t="NRAV" data-id="${esc(o.id)}" ${nrDis?'disabled':''} title="Não realizada após vistoria">NRAV</button>
    <button class="${nrOn('NAPL')?'on':''}" data-act="nr" data-t="NAPL" data-id="${esc(o.id)}" ${nrDis?'disabled':''} title="Não se aplica">NAPL</button></div></div>`;

/* ============ APONTAR (rateio) ============ */
let SH = null; // estado da folha de apontamento
function openApontar(rec){
  $('#toast').innerHTML='';
  if(rec){
    SH = {mode:'edit', recId:rec.id, ids:rec.os.map(o=>o.id), eq:rec.equipe.slice(), mats:JSON.parse(JSON.stringify(rec.mats||{})),
      di:rec.os[0].ini.slice(0,10), hi:rec.os[0].ini.slice(11), df:rec.os[rec.os.length-1].fim.slice(0,10), hf:rec.os[rec.os.length-1].fim.slice(11), info:rec.info};
  } else {
    if(!S.sel.length) return;
    const ids = filteredOrderIds(S.sel);
    const plan = ids.reduce((a,id)=>a+(osById(id).tmin||0),0);
    const fim = nowMin();
    const dur = plan>=ids.length ? Math.round(plan) : ids.length*5;
    const ini = addMin(fim, -dur);
    SH = {mode:'new', ids, eq:S.equipe.slice(), mats:{}, di:isoDate(ini), hi:csvT(ini), df:isoDate(fim), hf:csvT(fim), info:{}};
    for(const id of ids){ const o = osById(id); SH.info[id] = {patio:o.patio,loc:o.loc,ativo:o.ativo,atv:o.atv,tipo:o.tipo,tmin:o.tmin,desc:o.desc,lt:o.lt||''}; }
  }
  drawSheet();
}
function filteredOrderIds(ids){ // mantém a ordem da lista: pátio → ativo → atividade
  return ids.map(osById).filter(Boolean).sort((a,b)=>patioIdx(a.patio)-patioIdx(b.patio)||cmp(a.ativo,b.ativo)||cmp(a.atv,b.atv)).map(o=>o.id);
}
function infoOf(id){ return (SH.info&&SH.info[id]) || osById(id) || {}; }
function calc(){
  const r = {errors:[], warnings:[], slots:[], dur:0, plan:0, ok:false};
  const N = SH.ids.length;
  if(!N){ r.errors.push('Nenhuma OS no apontamento.'); return r; }
  if(!SH.eq.length) r.errors.push('Escolha a equipe.');
  if(!SH.di||!SH.hi||!SH.df||!SH.hf){ r.errors.push('Preencha data e hora de início e fim.'); return r; }
  const a = parseDT(SH.di+'T'+SH.hi), b = parseDT(SH.df+'T'+SH.hf);
  r.start = a; r.end = b;
  r.dur = Math.round((b-a)/60000);
  r.plan = SH.ids.reduce((s,id)=>s+(infoOf(id).tmin||0),0);
  if(r.dur<=0){ r.errors.push('O fim precisa ser depois do início.'); return r; }
  if(r.dur<N) r.errors.push(`Duração de ${r.dur} min é insuficiente para ${N} OS (mínimo 1 min por OS).`);
  const startMs = a.getTime();
  for(let i=0;i<N;i++){
    const s = addMin(a, Math.round(i*r.dur/N)), e = addMin(a, Math.round((i+1)*r.dur/N));
    r.slots.push({id:SH.ids[i], s, e, min:Math.round((e-s)/60000)});
  }
  if(r.slots.some(x=>x.min<=0) && !r.errors.length) r.errors.push('Alguma OS ficaria com 0 min.');
  if(r.dur > CFG.HORAS_ALERTA_DURACAO*60) r.warnings.push(`Duração de ${fmtHM(r.dur)} h — acima de ${CFG.HORAS_ALERTA_DURACAO} h. Confirme se está correto.`);
  // duplicidade (bloqueia)
  const st = statusMap();
  for(const id of SH.ids){ const s = st.get(id); if(s && !(s.k==='apont' && s.rec.id===SH.recId)) r.errors.push(`OS ${id} já foi tratada (${s.k==='apont'?'apontada':s.n.tipo}).`); }
  // sobreposição (avisa)
  const mats = new Set(SH.eq.map(e=>e.m));
  const conf = new Set();
  for(const rec of S.apont){ if(rec.id===SH.recId) continue;
    const ra = parseDT(rec.os[0].ini), rb = parseDT(rec.os[rec.os.length-1].fim);
    if(ra<b && a<rb){ for(const e of rec.equipe) if(mats.has(e.m)) conf.add(`${e.n} (${dispDT(ra)} – ${csvT(rb)})`); } }
  if(conf.size) r.warnings.push('Sobreposição de horário com outro apontamento de: '+[...conf].join('; ')+'.');
  r.ok = !r.errors.length;
  return r;
}
function drawSheet(){

  ov.innerHTML = `<div class="ov" data-ov><div class="sheet full" id="sheet">
    <div class="sh"><h3>${SH.mode==='edit'?'Editar apontamento':'Novo apontamento'}</h3><button class="btn sm" data-sx>Fechar</button></div>
    <div class="card"><div class="lbl" style="margin-top:0">Equipe</div>
      <div>${SH.eq.length?esc(eqNames(SH.eq)):'<span style="color:var(--bad)">Nenhuma equipe escolhida</span>'}</div>
      <button class="btn sm" data-sact="team" style="margin-top:8px">${SH.eq.length?'Alterar':'Escolher'} equipe</button></div>
    <div class="card"><div class="lbl" style="margin-top:0">Início</div>
      <div class="grid2"><input type="date" data-sf="di" value="${SH.di}"><input type="time" data-sf="hi" value="${SH.hi}"></div>
      <div class="lbl">Fim</div>

      <div class="row" style="margin-top:10px"><button class="btn sm" data-sact="fimagora">Fim = agora</button><button class="btn sm" data-sact="plan">Início = fim − planejado</button></div>
      ${SH.note?`<div class="banner warn">${esc(SH.note)}</div>`:''}
    </div>
    <div class="card"><div class="lbl" style="margin-top:0">Resumo</div>
      <div class="kpis"><div class="kpi"><b>${r.dur>0?fmtHM(r.dur):'—'}</b>real</div><div class="kpi"><b>${fmtHM(r.plan)}</b>planejado</div><div class="kpi"><b style="color:${diff>0?'var(--bad)':'var(--ok)'}">${r.dur>0?(diff>0?'+':'')+fmtHM(diff):'—'}</b>diferença</div></div>
      <div class="small mut" style="margin-top:6px">${SH.ids.length} OS × ${SH.eq.length||0} colaborador(es) = ${SH.ids.length*(SH.eq.length||0)} linhas no CSV${r.dur>0?` · duração ${decPT(r.dur)} min`:''}</div>
      ${r.errors.map(e=>`<div class="banner bad">${esc(e)}</div>`).join('')}${r.warnings.map(e=>`<div class="banner warn">${esc(e)}</div>`).join('')}
    </div>
    <div class="card"><div class="row" style="justify-content:space-between"><div class="lbl" style="margin:0">Rateio por OS</div><label class="sw"><input type="checkbox" data-ui="descSheet" ${S.ui.descSheet?'checked':''}> Mostrar descrição</label></div>
      <table class="rt"><tr><th>OS / ativo</th><th>Horário</th><th></th></tr>
      ${SH.ids.map((id,i)=>{ const inf=infoOf(id), sl=r.slots[i], m=SH.mats[id]||[]; return `<tr><td><b>${esc(id)}</b><div class="small mut">${esc(inf.ativo)}</div>
        ${S.ui.descSheet?`<div class="sdesc">${inf.desc?esc(inf.desc):'<span class="mut">(sem descrição)</span>'}</div><div class="tiny mut">Planejado ${fmtHM(inf.tmin||0)}</div>`:''}
        ${m.map((x,j)=>`<div class="mrow">▪ ${esc(x.desc)} <b>×${esc(decPT(x.qtd))}</b> <button class="btn sm" data-sact="rmmat" data-id="${esc(id)}" data-j="${j}" aria-label="Remover material">✕</button></div>`).join('')}
        <div class="row" style="gap:6px"><button class="btn sm" data-sact="mat" data-id="${esc(id)}" style="margin-top:6px">+ Material</button>${loteBtn(id, inf.lt, 'data-sact')}</div></td>
        <td>${sl?`${csvT(sl.s)}–${csvT(sl.e)}<div class="small mut">${sl.min} min</div>`:'—'}</td>
        <td>${SH.mode==='edit'||SH.ids.length>1?`<button class="btn sm dng" data-sact="rmos" data-id="${esc(id)}" aria-label="Remover OS">✕</button>`:''}</td></tr>`; }).join('')}</table></div>
    <button class="btn pri" style="width:100%" data-sact="ok" ${r.ok?'':'disabled'}>${SH.mode==='edit'?'Salvar alterações':'Confirmar apontamento'}</button>
  </div></div>`;
  ov.querySelector('.sheet').scrollTop = keep;
}
function sheetField(k, val){
  SH[k] = val; SH.note = '';
  if((k==='hf'||k==='df'||k==='hi'||k==='di') && SH.di&&SH.hi&&SH.df&&SH.hf){
    const a = parseDT(SH.di+'T'+SH.hi), b = parseDT(SH.df+'T'+SH.hf);
    if(b<=a && SH.di===SH.df && (k==='hf'||k==='hi')){ SH.df = isoDate(addMin(parseD(SH.di),1440)); SH.auto = true; SH.note = 'Fim antes do início: assumi o dia seguinte (turno da noite). Ajuste a data se não for o caso.'; }
    else if(SH.auto && (k==='hf'||k==='hi') && parseDT(SH.di+'T'+SH.hi) < parseDT(SH.di+'T'+SH.hf)){ SH.df = SH.di; SH.auto = false; }
  }
  drawSheet();
}
async function confirmSheet(){
  const r = calc(); if(!r.ok) return;
  if(r.warnings.length){
    const okk = await dialog({title:'Confirmar mesmo assim?', body:`<ul>${r.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`, ok:'Confirmar'});
    if(!okk) return;
  }
  const osList = r.slots.map(x=>({id:x.id, ini:isoDT(x.s), fim:isoDT(x.e), min:x.min}));
  if(SH.mode==='edit'){
    const rec = S.apont.find(x=>x.id===SH.recId);
    rec.os = osList; rec.equipe = SH.eq.slice(); rec.mats = SH.mats; rec.info = SH.info;
    if(rec.exportadoEm) rec.alteradoEm = isoDT(nowMin());
    osList.forEach(x=>{ if(S.lote[x.id]){ syncAutoExtra(x.id); syncAutoNota(x.id); } });
    toast('Apontamento atualizado.');
  } else {
    S.apont.push({id:uid(), criadoEm:isoDT(nowMin()), equipe:SH.eq.slice(), os:osList, mats:SH.mats, info:SH.info, exportadoEm:null, alteradoEm:null});
    setSel(SH.ids, false);
    osList.forEach(x=>{ if(S.lote[x.id]){ syncAutoExtra(x.id); syncAutoNota(x.id); } });
    const nl = osList.filter(x=>{ const lt = ltFor(x.id, SH.info); const st = lt && loteStatus(x.id, lt); return st && !st.ok; }).length;
    if(nl) toast(`${osList.length} OS apontadas. ${nl} com formulário pendente.`, 'Preencher', ()=>go('lotes'), 9000);
    else toast(`${osList.length} OS apontadas.`);

}

function recCard(r){

const KOPT = {sn:['0001 NÃO','0002 SIM'], cf:['0001 CONFORME','0002 NAO CONFORME']};
const optLabel = v => String(v).replace(/^\d+\s/,'').replace('NAO CONFORME','NÃO CONFORME');
const isSim = v => v==='0002 SIM';
const NUMRE = /^-?\d+([.,]\d+)?$/;
const ltFor = (osId, info) => (info && info[osId] && info[osId].lt) || (osById(osId)||{}).lt || '';
function infoAny(osId){
  const o = osById(osId); if(o) return o;
  if(SH && SH.info && SH.info[osId]) return SH.info[osId];
  for(const r of S.apont) if(r.info && r.info[osId]) return r.info[osId];
  return {};
}
function loteStatus(osId, ltId){
  const t = B.lotesMap && B.lotesMap[ltId]; if(!t) return null;
  const v = (S.lote[osId] && S.lote[osId].v) || {};
  const qs = t.q.map(c=>({c, d:(B.perg[c]||['?'])[0], k:(B.perg[c]||[0,'tx'])[1]}));
  const anySim = qs.some(q=>q.k==='sn' && isSim(v[q.c]));
  const miss = [];
  for(const q of qs){
    const x = v[q.c];
    if(q.c===CFG.LOTE.obs){ if(anySim && !String(x||'').trim()) miss.push(q); continue; }
    if(t.tp==='P' && q.k!=='sn') continue; // Prospecção: demais campos não são exigidos um a um
    if(x===undefined || x==='' || (q.k==='nm' && !NUMRE.test(String(x).trim()))) miss.push(q);
  }
  if(t.tp==='P'){ // ao menos uma medição/verificação precisa ter informação (não divulgado no app)
    const outros = qs.filter(q=>q.k!=='sn' && q.c!==CFG.LOTE.obs);
    const algum = outros.some(q=>{ const x=v[q.c]; return x!==undefined && String(x).trim()!=='' && (q.k!=='nm' || NUMRE.test(String(x).trim())); });
    if(outros.length && !algum) miss.push({c:'_p', d:'', k:'tx', oculto:true});
  }
  return {t, qs, v, miss, anySim, obrig:true, ok:miss.length===0};
}
function setLote(osId, ltId, cod, val){
  const e = S.lote[osId] || (S.lote[osId] = {lt:ltId, v:{}});
  e.lt = ltId; e.v[cod] = val;
  if(isSim(val) && (cod===CFG.LOTE.nec || cod===CFG.LOTE.imed)){ // só uma das duas pode ser SIM
    const other = cod===CFG.LOTE.nec ? CFG.LOTE.imed : CFG.LOTE.nec;
    if(B.lotesMap[ltId].q.includes(other)) e.v[other] = '0001 NÃO';
  }
  e.em = isoDT(nowMin()); e.exportadoEm = null; save();
  syncAutoExtra(osId); syncAutoNota(osId);
}
function loteItems(){
  const seen = new Map();
  for(const r of S.apont) for(const o of r.os){ const lt = ltFor(o.id, r.info); if(lt && B.lotesMap && B.lotesMap[lt]) seen.set(o.id, {id:o.id, lt, rec:r}); }
  return [...seen.values()].map(x=>Object.assign(x,{st:loteStatus(x.id,x.lt)}));
}
function loteCounts(){ const it = loteItems(); return {obr:it.filter(i=>i.st.t.tp==='I'&&!i.st.ok).length, pro:it.filter(i=>i.st.t.tp==='P'&&!i.st.ok).length, ok:it.filter(i=>i.st.ok).length}; }
function loteTag(o){

}
function loteBanner(st){
  if(st.ok) return `<div class="banner ok" id="lbn">Formulário completo.</div>`;
  const nomes = st.t.tp==='I' ? ' — '+esc(st.miss.map(q=>q.d).join(' · ')) : '';

function openLote(osId, ltId){
  const t = B.lotesMap && B.lotesMap[ltId]; if(!t) return;

function loteFaltas(g){ // OS do grupo com lote incompleto

function loteRows(g){
  const rows = [], seen = new Set();

    if(seen.has(o.id)) continue; seen.add(o.id);
    const lt = ltFor(o.id, r.info), st = lt ? loteStatus(o.id, lt) : null, e = S.lote[o.id]; if(!st || !e) continue;

}

function pickAtivo(cb){
  const ov = document.createElement('div'); ov.className='ov'; ov.style.zIndex=85; document.body.appendChild(ov);

  const draw = () => {
    const locs = [...new Set(B.av.filter(a=>!f.p||a.patio===f.p).map(a=>a.loc))].sort(cmp);
    if(f.l && !locs.includes(f.l)) f.l = '';
    const q = f.q.trim().toLowerCase();
    const res = B.av.filter(a=>(!f.p||a.patio===f.p)&&(!f.l||a.loc===f.l)&&(!q||a.ativo.toLowerCase().includes(q))).slice(0,60);
    ov.innerHTML = `<div class="sheet full"><div class="sh"><h3>Escolher ativo</h3><button class="btn sm" data-px>Fechar</button></div>
      <div class="filters"><select data-pf="p"><option value="">Todos os pátios</option>${patios.map(p=>`<option ${f.p===p?'selected':''}>${esc(p)}</option>`).join('')}</select>

  };
  ov.onchange = e => { const t = e.target.closest('select[data-pf]'); if(t){ f[t.dataset.pf] = t.value; draw(); } };
  ov.oninput = e => { const t = e.target.closest('input[data-pf]'); if(t){ f.q = t.value; const pos = t.selectionStart; draw(); const n = ov.querySelector('#pq'); n.focus(); n.setSelectionRange(pos,pos); } };
  ov.onclick = e => {
    if(e.target.closest('[data-px]')){ ov.remove(); return; }
    const b = e.target.closest('[data-pi]'); if(b){ const it = ov._res[+b.dataset.pi]; ov.remove(); cb(it); }
  };
  draw();
}

function syncAutoNota(osId){
  let rec = null; for(const r of S.apont) if(r.os.some(o=>o.id===osId)) rec = r;
  const e = S.lote[osId], sim = !!(e && isSim(e.v[CFG.LOTE.nec]));
  const cur = S.notas.find(x=>x.auto===osId);
  if(!rec || !sim){ if(cur && !sim && !cur.exportadoEm){ S.notas = S.notas.filter(x=>x!==cur); save(); } return; }
  const inf = (rec.info && rec.info[osId]) || infoAny(osId);
  const obs = String((e.v[CFG.LOTE.obs]||'')).trim();
  const dados = {equipe:rec.equipe.slice(), data:rec.os[0].ini.slice(0,10), ativo:inf.ativo||'', patio:inf.patio||'', loc:inf.loc||'', tipo:((ativoMap().get(inf.ativo)||{}).tipo)||''};
  const desc = obs || ('NECESSIDADE DE MANUTENÇÃO IDENTIFICADA NA OS '+osId);
  if(cur){ if(!cur.exportadoEm){ Object.assign(cur, dados); if(cur.descAuto) cur.desc = desc; } }
  else S.notas.push(Object.assign({id:'NOTA-'+uid(), auto:osId, descAuto:true, area:'EE', cod:'', nome:'', desc, kmi:'', kmf:'', criadoEm:isoDT(nowMin()), exportadoEm:null}, dados));
  save();
}

function syncAutoExtra(osId){

function allDays(){
  const s = new Set();

function viewExportar(){

  $('#view').innerHTML = `<div class="card"><h2>Dia</h2><select id="expday">${days.map(d=>`<option value="${d}" ${d===EXP_DAY?'selected':''}>${esc(dispD(parseD(d)))}</option>`).join('')}</select>

      <div class="small mut">${g.pend?`${g.pend} item(ns) ainda não enviado(s)`:'Tudo já enviado. Subir de novo é seguro (não duplica).'}</div>
      ${(()=>{ const f = loteFaltas(g); return f.obr.length?`<div class="banner bad">Envio bloqueado: ${f.obr.length} OS com formulário pendente (${esc(f.obr.slice(0,6).join(', '))}${f.obr.length>6?'…':''}). <button class="btn sm pri" data-act="tab" data-t="lotes">Preencher formulários</button></div>`:''; })()}
      <div class="row" style="margin-top:10px"><button class="btn pri" data-act="up" data-g="${i}" ${(loteFaltas(g).obr.length||UP_BUSY)?'disabled':''}>${UP_BUSY===i+1?'Enviando…':'Subir apontamentos'}</button><button class="btn" data-act="dl" data-g="${i}" ${UP_BUSY?'disabled':''}>Baixar CSV (reserva)</button></div></div>`).join('')}`;
  $('#expday').onchange = e => { EXP_DAY = e.target.value; viewExportar(); };

function exportGroups(day){
  const map = new Map();
  const get = eq => { const k = eqKey(eq); if(!map.has(k)) map.set(k,{eq:sortEq(eq),ap:[],nr:[],ex:[],nt:[],linhas:0,nmat:0,pend:0}); return map.get(k); };
  for(const r of S.apont) if(r.os[0].ini.slice(0,10)===day){ const g=get(r.equipe); g.ap.push(r); g.linhas+=r.os.length*r.equipe.length; g.nmat+=Object.values(r.mats||{}).reduce((a,x)=>a+x.length,0); if(!r.exportadoEm||r.alteradoEm) g.pend++; r.os.forEach(o=>{ const e=S.lote[o.id]; if(e && !e.exportadoEm && Object.keys(e.v).length && !(!r.exportadoEm||r.alteradoEm)) g.pend++; }); }
  for(const n of S.notas) if(n.data===day && n.cod){ const g=get(n.equipe); g.nt.push(n); if(!n.exportadoEm) g.pend++; }
  for(const x of S.extra) if(x.data===day){ const g=get(x.equipe); g.ex.push(x); g.nmat+=(x.mats||[]).length; if(!x.exportadoEm||x.alteradoEm) g.pend++; }
  for(const n of S.nrav) if(n.data===day){ const g=get(n.equipe||[]); g.nr.push(n); if(!n.exportadoEm) g.pend++; }
  return [...map.values()];
}
const csvCell = v => { v = String(v ?? ''); return /[;"\r\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
const csv = (head, rows) => '\uFEFF'+[head, ...rows.map(r=>{ r=r.slice(); while(r.length<head.length) r.push(''); return r; })].map(r=>r.map(csvCell).join(';')).join('\r\n')+'\r\n';
const CSV_HEAD = ['ID','Tipo','Matrícula','Colaborador','Ordem de Serviço','Data início','Hora início','Data fim','Hora fim','Duração (min)','Código material','Descrição material','Quantidade aplicada','Data informada','Registrado em','Código lote','Pergunta lote','Resposta lote','Ativo','Descrição atividade','Ref. extra','Área nota','Cód. nota','Codificação nota','KM início','KM fim','Ref. nota'];
function buildFiles(g, day){
  const key = eqKey(g.eq) || 'sem-equipe';
  const rows = [];
  for(const r of g.ap.slice().sort((a,b)=>a.os[0].ini.localeCompare(b.os[0].ini))){
    const reg = dispDT(parseDT(r.criadoEm));
    for(const o of r.os){
      const s = parseDT(o.ini), e = parseDT(o.fim);
      for(const q of sortEq(r.equipe))
        rows.push([`${r.id}-${o.id}-${q.m}`, 'APONTADA', q.m, q.n, o.id, csvD(s), csvT(s), csvD(e), csvT(e), decPT((e-s)/60000), '', '', '', '', reg]);
      (r.mats[o.id]||[]).forEach((m,j)=>rows.push([`${r.id}-${o.id}-MAT${j+1}`, 'MATERIAL', '', '', o.id, '', '', '', '', '', m.cod, m.desc, decPT(m.qtd), '', reg]));
    }
  }
  rows.push(...loteRows(g));
  for(const n of g.nt){ const eq = sortEq(n.equipe||[]), dt = csvD(parseD(n.data)), reg = dispDT(parseDT(n.criadoEm));
    eq.forEach(q=>rows.push([`${n.id}-${q.m}`,'NOTA',q.m,q.n,'','','','','','','','','',dt,reg,'','','',n.ativo,n.desc,'',AREAS[n.area]||n.area,n.cod,n.nome,n.kmi?n.kmi.replace('.',','):'',n.kmf?n.kmf.replace('.',','):'',n.id])); }
  for(const n of g.nr){ const eq = sortEq(n.equipe||[]); const base = (m,nm,id)=>[id, n.tipo, m, nm, n.os, '', '', '', '', '', '', '', '', csvD(parseD(n.data)), dispDT(parseDT(n.criadoEm))];
    if(eq.length) eq.forEach(q=>rows.push(base(q.m,q.n,`${n.id}-${q.m}`))); else rows.push(base('','',n.id)); }
  for(const x of g.ex){ const reg = dispDT(parseDT(x.criadoEm)), dt = csvD(parseD(x.data));
    sortEq(x.equipe).forEach(q=>rows.push([`${x.id}-${q.m}`,'EXTRA',q.m,q.n,'','','','','','','','','',dt,reg,'','','',x.ativo,x.desc,x.id,'','','','','',(x.notas||[]).join(',')]));
    (x.mats||[]).forEach((m,j)=>rows.push([`${x.id}-MAT${j+1}`,'MATERIAL','','','','','','','','',m.cod,m.desc,decPT(m.qtd),dt,reg,'','','',x.ativo,'',x.id])); }
  return rows.length ? [{name:`APONTAMENTOS_${day}_${key}.csv`, text:csv(CSV_HEAD, rows)}] : [];
}

async function doExport(i, modo){

/* ============ MÊS DO PLANO ============ */
const MES_N = ['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesNum = s => MES_N.indexOf(String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''));
const mesDist = n => { let d=(n-new Date().getMonth()+12)%12; return d>6 ? d-12 : d; };
function mesesLista(){
  const st = statusMap(), m = new Map();
  for(const t of (B.totais||[])) if(t.m) m.set(t.m, m.get(t.m)||0);
  for(const o of B.os) if(o.mes) m.set(o.mes, (m.get(o.mes)||0) + (st.has(o.id)?0:1));
  return [...m.entries()].map(([nome,pend])=>({nome,pend})).sort((a,b)=>{ const x=mesNum(a.nome), y=mesNum(b.nome); return (x<0?99:mesDist(x))-(y<0?99:mesDist(y)) || cmp(a.nome,b.nome); });
}
function mesSel(){ // '' = sem filtro (um mês só ou base antiga) · '*' = todos · senão o nome do mês
  const L = mesesLista(); if(L.length<2) return '';
  if(S.f.mes==='*') return '*';
  if(S.f.mes && L.some(x=>x.nome===S.f.mes)) return S.f.mes;
  let best = null;
  for(const x of L){ const n = mesNum(x.nome); if(n<0) continue; const d = mesDist(n); if(d===0) return x.nome; if(d<0 && (!best || d>best.d)) best = {d, nome:x.nome}; }
  return best ? best.nome : L[0].nome;
}
const mesOk = sel => o => !sel || sel==='*' || !o.mes || o.mes===sel;
function mesBar(){
  const L = mesesLista(); if(L.length<2) return '';
  const sel = mesSel();
  return `<div class="card"><div class="tiny mut">Mês do plano</div><div class="chips">${L.map(x=>`<button class="cbtn ${x.pend?'has seg':''} ${sel===x.nome?'on':''}" data-act="mes" data-m="${esc(x.nome)}">${esc(x.nome)} · ${x.pend}</button>`).join('')}<button class="cbtn ${sel==='*'?'on':''}" data-act="mes" data-m="*">Todos</button></div></div>`;
}

function totAdj(m,p,l,a,d){
  let t = (B.totais||[]).find(x=>x.p===p&&x.l===l&&(x.m===undefined||x.m===m));
  if(!t){ if(d<0) return; t = {p,l,t:0,s:0,c:0,m}; (B.totais = B.totais||[]).push(t); }
  t.t = Math.max(0,t.t+d); if(a.ok&&a.fin==='SEG') t.s = Math.max(0,t.s+d); if(a.ok&&a.ci) t.c = Math.max(0,t.c+d);
}
function applyLocais(){
  const L = Object.assign({}, B.locaisSrv||{}); for(const [k,v] of Object.entries(S.locais||{})) L[k] = {p:v.p,l:v.l,t:v.t};
  const ks = Object.keys(L); if(!ks.length) return;
  for(const o of B.os){
    const v = L[o.ativo]; if(!v || o._lo || !(o.patio==='(sem pátio)'||o.loc==='(sem localidade)')) continue;
    const a = parseAtv(o.atv); totAdj(o.mes,o.patio,o.loc,a,-1); o.patio = v.p; o.loc = v.l||'(sem localidade)'; o._lo = 1; totAdj(o.mes,o.patio,o.loc,a,+1);
    if(v.t && !o.tipo) o.tipo = v.t;
    if(!B.patios.includes(o.patio)) B.patios.push(o.patio);
  }
  for(const k of ks){ const v = L[k]; const e = (B.av||[]).find(x=>x.ativo===k); if(e){ if(e.patio==='(sem pátio)'||e.loc==='(sem localidade)'||!e.patio){ e.patio=v.p; e.loc=v.l||e.loc; } if(v.t&&!e.tipo) e.tipo=v.t; } else (B.av = B.av||[]).push({patio:v.p,loc:v.l,ativo:k,tipo:v.t||''}); }
  B._am = null;
}

/* ============ ACOMPANHAMENTO ============ */
const ACOMP_OPEN = new Set();
const pct = (a,b) => b>0 ? Math.round(a*100/b) : 0;
function acompData(){
  const st = statusMap(), map = new Map(), ms = mesSel();
  const get = (p,l) => { const k=p+'|'+l; if(!map.has(k)) map.set(k,{p,l,t:0,s:0,c:0,pend:[],ps:0,pc:0}); return map.get(k); };
  for(const t of (B.totais||[])){ if(ms && ms!=='*' && t.m!==undefined && t.m!==ms) continue; const g=get(t.p,t.l); g.t+=t.t; g.s+=t.s; g.c+=t.c; }
  for(const o of B.os){
    if(st.has(o.id) || !mesOk(ms)(o)) continue;
    const g = get(o.patio,o.loc), a = parseAtv(o.atv);
    g.pend.push(o); if(a.ok&&a.fin==='SEG') g.ps++; if(a.ok&&a.ci) g.pc++;
  }
  const pats = new Map();
  for(const g of map.values()){
    g.t = Math.max(g.t,g.pend.length); g.s = Math.max(g.s,g.ps); g.c = Math.max(g.c,g.pc);
    g.pend.sort((x,y)=>cmp(x.ativo,y.ativo)||cmp(x.atv,y.atv));
    if(!pats.has(g.p)) pats.set(g.p,{p:g.p,t:0,s:0,c:0,np:0,ps:0,pc:0,locs:[]});
    const P = pats.get(g.p); P.t+=g.t; P.s+=g.s; P.c+=g.c; P.np+=g.pend.length; P.ps+=g.ps; P.pc+=g.pc; P.locs.push(g);
  }
  const list = [...pats.values()].sort((a,b)=>patioIdx(a.p)-patioIdx(b.p));
  list.forEach(P=>P.locs.sort((a,b)=>cmp(a.l,b.l)));
  const T = list.reduce((a,P)=>({t:a.t+P.t,s:a.s+P.s,c:a.c+P.c,np:a.np+P.np,ps:a.ps+P.ps,pc:a.pc+P.pc}),{t:0,s:0,c:0,np:0,ps:0,pc:0});
  return {list, T};
}

function viewAcomp(){

  const done = T.t-T.np, pc = pct(done,T.t);
  const C = 2*Math.PI*42, dash = C*pc/100;
  const donut = `<svg width="116" height="116" viewBox="0 0 116 116" role="img" aria-label="${pc}% concluído"><circle cx="58" cy="58" r="42" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="58" cy="58" r="42" fill="none" stroke="#2e9d5f" stroke-width="14" stroke-dasharray="${dash} ${C}" transform="rotate(-90 58 58)" stroke-linecap="butt"/><text x="58" y="55" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">${pc}%</text><text x="58" y="74" text-anchor="middle" font-size="11" fill="var(--mut)">concluído</text></svg>`;
  const kp = (lbl,np,t,cls) => `<div class="kpi" style="text-align:left"><span class="tiny mut">${lbl}</span><b style="color:${np?`var(--${cls})`:'var(--ok)'}">${np} <span class="small mut" style="font-weight:500">pend.</span></b><span class="small">de ${t} · ${pct(np,t)}%</span>${barHtml(np,t,true)}</div>`;
  const nsl = (getAuth()||{}).adm ? semLocal().length : 0;
  let h = mesBar() + (nsl ? `<div class="card"><div class="row" style="justify-content:space-between"><span class="small"><b>${nsl}</b> ativo(s) sem pátio/localidade</span><button class="btn sm pri" data-act="locais">Definir</button></div></div>` : '') + `<div class="card"><h2>Plano de manutenção</h2>
    <div class="donutw">${donut}<div class="grow small"><div><b>${T.t}</b> programadas</div><div style="color:var(--ok)"><b>${done}</b> realizadas</div><div style="color:var(--warn)"><b>${T.np}</b> pendentes (${pct(T.np,T.t)}%)</div></div></div>
    <div class="grid2" style="margin-top:12px">${kp('Segurança (SEG)',T.ps,T.s,'seg')}${kp('Com intervalo (C·I)',T.pc,T.c,'ci')}</div>
    <div class="row" style="margin-top:12px"><label class="sw"><input type="checkbox" data-ui="acompAll" ${S.ui.acompAll?'checked':''}> Exibir OS pendentes de SEG e C·I</label>
    <label class="sw"><input type="checkbox" data-ui="acompSo" ${S.ui.acompSo?'checked':''}> Só com pendências</label></div>
    <div class="tiny mut" style="margin-top:6px">Atualizado com os apontamentos e NRAV/NAPL feitos neste aparelho. Base de ${esc(dispDT(parseDT(B.geradoEm)))}.</div></div>`;
  for(const P of list){
    const locs = P.locs.filter(g=>!S.ui.acompSo || g.pend.length);
    if(S.ui.acompSo && !P.np) continue;
    h += `<div class="card"><div class="row" style="justify-content:space-between"><b style="font-size:17px">${esc(P.p)}</b><span class="small"><b>${P.np}</b> pend. de ${P.t} · ${pct(P.np,P.t)}%</span></div>${barHtml(P.np,P.t)}
      <div style="margin-top:6px">${locs.map(g=>locRow(g)).join('')||'<div class="small mut">Sem pendências.</div>'}</div></div>`;
  }
  if(!list.length) h += '<div class="card"><div class="empty">Sem dados de programação na base.</div></div>';
  $('#view').innerHTML = h;
}
function locRow(g){
  const k = g.p+'|'+g.l;
  const open = t => (S.ui.acompAll && t!=='all') !== ACOMP_OPEN.has(k+'|'+t);
  const seg = g.pend.filter(o=>{const a=parseAtv(o.atv);return a.ok&&a.fin==='SEG';}), ci = g.pend.filter(o=>{const a=parseAtv(o.atv);return a.ok&&a.ci;});
  const ch = (t,lbl,n,tot,cls) => `<button class="cbtn ${cls} ${n?'has':''} ${open(t)?'on':''}" data-act="acompRow" data-k="${esc(k+'|'+t)}" ${n?'':'disabled'}>${lbl} ${n}/${tot}</button>`;
  const lists = [['seg',seg],['ci',ci],['all',g.pend]].filter(([t])=>open(t)).map(([t,arr])=>
    `<div class="plist"><div class="tiny mut" style="font-weight:700">${t==='seg'?'Segurança pendentes':t==='ci'?'Com intervalo pendentes':'Todas as pendentes'} (${arr.length})</div>${arr.map(pendItem).join('')}</div>`).join('');
  return `<div class="arow"><div class="row" style="justify-content:space-between"><b>${esc(g.l)}</b><span class="small"><b>${g.pend.length}</b> pend. de ${g.t} · ${pct(g.pend.length,g.t)}%</span></div>${barHtml(g.pend.length,g.t)}
    <div class="chips">${ch('seg','SEG',g.ps,g.s,'seg')}${ch('ci','C·I',g.pc,g.c,'ci')}${ch('all','Todas',g.pend.length,g.t,'')}</div>${lists}</div>`;
}

/* ============ ATUALIZAÇÃO ============ */
function fetchT(url, opts, ms){ // fetch com tempo limite
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms);
  return fetch(url, Object.assign({signal:c.signal}, opts||{})).finally(()=>clearTimeout(t));
}
const apiOk = () => CFG.API_URL && !CFG.API_URL.startsWith('__');
const apiUrl = q => CFG.API_URL + (CFG.API_URL.includes('?')?'&':'?') + q + '&t=' + Date.now();
async function conectado(){ // confirma que há internet de verdade (não só "sinal") e que o servidor responde
  if(!navigator.onLine || !apiOk()) return false;
  try{ const r = await fetchT(apiUrl('r=ping'), {cache:'no-store'}, 8000); return r.ok; }catch(e){ return false; }
}
async function refreshAuth(){
  const a = getAuth(); if(!a) return;
  try{ const j = await admApi('login'); if(j && j.ok){ if(!!j.adm!==!!a.adm){ a.adm=!!j.adm; setAuth(a); render(); } } else if(j && j.erro==='acesso'){ setAuth(null); showLogin('Seu acesso foi revogado ou o código mudou.'); } }catch(e){}
}
async function verificar(silent){
  refreshAuth(); enviarLocais();
  const v = {quando:Date.now(), ok:false, novaVersao:null};
  try{
    if(apiOk()){
      const res = await fetchT(apiUrl('r=estado'), {cache:'no-store'}, 15000);
      const E = await res.json();
      v.ok = !!E && Array.isArray(E.feitas);
      if(v.ok){
        if(E.geradoEm && E.geradoEm > (EMB.estadoEm||'')){ try{ localStorage.setItem(CFG.LS_ESTADO, JSON.stringify(E)); }catch(e){} v.novaVersao = E.geradoEm; }
        if(E.baseEm && E.baseEm > (EMB.geradoEm||'')){
          const rb = await fetchT(apiUrl('r=base'), {cache:'no-store'}, 40000);
          const Bn = await rb.json();
          if(Bn && Bn.v===3 && Bn.geradoEm && baseOk(Bn)){ try{ localStorage.setItem(CFG.LS_BASE, JSON.stringify(Bn)); v.novaVersao = Bn.geradoEm; }catch(e){} }
        }
        try{ localStorage.setItem(CFG.LS_SYNC, String(Date.now())); }catch(e){}
      }
    }
  }catch(e){}
  S.verif = v; save();
  if(!silent) toast(v.novaVersao ? 'Há dados mais novos disponíveis.' : v.ok ? 'Você já está com os dados mais recentes.' : 'Sem conexão: usando os dados deste aparelho.');
  if(!document.querySelector('.ov,.dlg')) render();
}
function recarregar(){ location.href = location.href.split('#')[0].split('?')[0] + '?v=' + Date.now(); }

/* ============ EVENTOS ============ */
document.addEventListener('click', async e => {
  const t = e.target;
  // sheet
  if(t.closest('[data-sx]')){ SH=null; closeOv(); return; }
  const sa = t.closest('[data-sact]');
  if(sa){
    const a = sa.dataset.sact;
    if(a==='ok') confirmSheet();
    else if(a==='team'){ const prev=SH; openTeamFor(eq=>{ SH.eq=eq; drawSheet(); }); }
    else if(a==='fimagora'){ const n=nowMin(); SH.df=isoDate(n); SH.hf=csvT(n); SH.note=''; drawSheet(); }
    else if(a==='plan'){ const r=calc(); if(SH.df&&SH.hf){ const f=parseDT(SH.df+'T'+SH.hf); const s=addMin(f,-Math.max(1,Math.round(SH.ids.reduce((x,id)=>x+(infoOf(id).tmin||0),0)))); SH.di=isoDate(s); SH.hi=csvT(s); SH.note=''; drawSheet(); } }
    else if(a==='mat'){ const mid=sa.dataset.id; openMaterial('OS '+mid, it=>{ (SH.mats[mid]=SH.mats[mid]||[]).push(it); drawSheet(); }); }
    else if(a==='lote') openLote(sa.dataset.id, sa.dataset.lt);
    else if(a==='rmmat'){ SH.mats[sa.dataset.id].splice(+sa.dataset.j,1); drawSheet(); }
    else if(a==='rmos'){ SH.ids = SH.ids.filter(x=>x!==sa.dataset.id); delete SH.mats[sa.dataset.id]; drawSheet(); }
    return;
  }
  const b = t.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch(act){
    case 'tab': go(b.dataset.t); break;
    case 'mf': openMulti(b.dataset.k); break;
    case 'mes': S.f.mes = b.dataset.m; save(); if(S.ui.tab==='acomp') viewAcomp(); else viewOrdens(); break;
    case 'locais': openLocais(); break;
    case 'adm_novo': { const p = (ADM.lista||[]).find(x=>x.mat===id); if(p && await dialog({title:'Gerar novo código?', body:`<p>O código atual de <b>${esc(p.nome||id)}</b> deixa de valer.</p>`, ok:'Gerar'})) admAcao('adm_novo', {alvo:id}, p.nome||id); break; }
    case 'adm_rev': { const p = (ADM.lista||[]).find(x=>x.mat===id); if(p && await dialog({title:'Revogar acesso?', body:`<p><b>${esc(p.nome||id)}</b> não poderá mais enviar. Um novo código reativa.</p>`, ok:'Revogar', danger:true})) admAcao('adm_revogar', {alvo:id}); break; }
    case 'adm_inc': { const m = prompt('Matrícula da pessoa:'); if(!m) break; const n = prompt('Nome:'); if(!n) break; admAcao('adm_incluir', {alvo:m.trim(), nome:n.trim()}, n.trim()); break; }
    case 'logout': if(await dialog({title:'Sair?', body:'<p>Para enviar apontamentos de novo será preciso entrar com matrícula e código. O que está salvo neste aparelho continua aqui.</p>', ok:'Sair', danger:true})){ setAuth(null); render(); } break;
    case 'team': openTeam(); break;
    case 'lote': openLote(id, b.dataset.lt); break;
    case 'lprev': lotePrev(b.dataset.lt); break;
    case 'xnew': openExtra(); break;
    case 'xedit': openExtra(S.extra.find(x=>x.id===id)); break;
    case 'nnew': openNota(); break;
    case 'ncod': { const n = S.notas.find(y=>y.id===id); if(!n) break; const ls = B.notasCat.filter(c=>c.r==='EE' && (!n.tipo||c.t===n.tipo)); pickCod(ls, c=>{ n.cod=c.c; n.nome=c.n; save(); render(); toast('Codificação definida. A nota será enviada no CSV do dia.'); }); break; }
    case 'narea': S.ui.nArea = b.dataset.a; save(); viewNotas(); break;
    case 'ntratar': { const n = allNotas().find(y=>y.id===id); openExtra(null, {ativo:n.ativo, patio:n.patio, loc:n.loc, notas:[id]}); break; }
    case 'xdel': if(await dialog({title:'Excluir ordem extra?', body:`<p>${S.extra.find(x=>x.id===id).exportadoEm?'<b>Já foi enviada; avise o ADM.</b>':'Ela não será enviada.'}</p>`, ok:'Excluir', danger:true})){ S.extra = S.extra.filter(x=>x.id!==id); for(const k2 of Object.keys(S.nvinc)) if(S.nvinc[k2]===id) delete S.nvinc[k2]; save(); render(); } break;
    case 'verif': verificar(false); break;
    case 'reload': recarregar(); break;
    case 'purge': {
      const n = S.apont.filter(r=>r.exportadoEm&&!r.alteradoEm).length + S.nrav.filter(r=>r.exportadoEm).length + S.extra.filter(x=>x.exportadoEm&&!x.alteradoEm).length + S.notas.filter(n=>n.exportadoEm).length;
      if(!n){ toast('Não há registros já enviados.'); break; }
      if(await dialog({title:'Limpar enviados?', body:`<p>${n} registro(s) já enviado(s) serão apagados deste aparelho. As OS continuarão tratadas na base da planilha.</p>`, ok:'Apagar', danger:true})){
        S.apont = S.apont.filter(r=>!(r.exportadoEm&&!r.alteradoEm) || r.os.some(o=>{ const lt=ltFor(o.id,r.info), st=lt&&loteStatus(o.id,lt); return st&&!st.ok; })); S.nrav = S.nrav.filter(r=>!r.exportadoEm); S.extra = S.extra.filter(x=>!(x.exportadoEm&&!x.alteradoEm)); S.notas = S.notas.filter(n=>!n.exportadoEm); save(); render(); }
      break; }
    case 'desc': b.classList.toggle('open'); break;
    case 'selAtivo': {
      const st = statusMap();
      const ids = B.os.filter(o=>o.ativo===b.dataset.ativo&&o.patio===b.dataset.patio&&!st.has(o.id)).map(o=>o.id);
      setSel(ids, b.checked); updateLista(); break; }
    case 'sel': setSel([id], b.checked); updateLista(); break;
    case 'nr': toggleNR(id, b.dataset.t); break;
    case 'acompRow': { const k=b.dataset.k; ACOMP_OPEN.has(k)?ACOMP_OPEN.delete(k):ACOMP_OPEN.add(k); const y=window.scrollY; viewAcomp(); window.scrollTo(0,y); break; }
    case 'clearSel': S.sel=[]; save(); updateLista(); break;
    case 'apontar':
      if(!S.equipe.length){ toast('Escolha a equipe antes de apontar.', 'Escolher', openTeam); break; }
      openApontar(); break;
    case 'edit': openApontar(S.apont.find(r=>r.id===id)); break;
    case 'del': {
      const r = S.apont.find(x=>x.id===id);
      if(await dialog({title:'Excluir apontamento?', body:`<p>${r.os.length} OS voltam para a lista de pendentes.${r.exportadoEm?'<br><b>Este apontamento já foi enviado; avise o ADM.</b>':''}</p>`, ok:'Excluir', danger:true})){
        S.apont = S.apont.filter(x=>x.id!==id); save(); render(); }
      break; }
    case 'nrdel': S.nrav = S.nrav.filter(n=>n.id!==id); save(); render(); break;
    case 'dl': doExport(+b.dataset.g, 'dl'); break;
    case 'up': doExport(+b.dataset.g, 'up'); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.matches('[data-f="q"]')) return; // a busca já filtra no evento input; refazer a lista aqui engolia o primeiro toque após digitar
  else if(t.matches('[data-pp]')){ S.ui[t.dataset.pp] = t.value; if(t.dataset.pp==='pPatio') S.ui.pLoc=''; save(); viewPend(); }
  else if(t.matches('[data-ui]')){ S.ui[t.dataset.ui] = t.checked; save(); if(SH) drawSheet(); else if(S.ui.tab==='ordens') updateLista(); else render(); }
  else if(t.id==='selAll'){
    const st = statusMap(); let list = filtered().filter(o=>!st.has(o.id));
    setSel(list.map(o=>o.id), t.checked); updateLista();
  }
  else if(t.matches('[data-sf]')) sheetField(t.dataset.sf, t.value);
  else if(t.dataset.act==='nrdate'){ const n = S.nrav.find(x=>x.id===t.dataset.id); if(n && t.value){ n.data=t.value; n.exportadoEm=null; save(); render(); } }
});
document.addEventListener('input', e => { if(e.target.matches('[data-f="q"]')){ S.f.q = e.target.value; save(); updateLista(); } });
function openTeamFor(cb, cur){ // seletor de equipe reutilizável dentro da folha
  const ov = document.createElement('div'); ov.className='ov'; ov.style.zIndex=80;
  const sel = new Set((cur||SH.eq).map(e=>e.m));
  ov.innerHTML = `<div class="sheet"><div class="sh"><h3>Equipe</h3><button class="btn sm" data-x>Cancelar</button><button class="btn sm pri" data-ok>Usar</button></div>
    <div class="team">${B.colaboradores.map(c=>`<label class="${sel.has(c.mat)?'on':''}"><input type="checkbox" value="${esc(c.mat)}" ${sel.has(c.mat)?'checked':''}><span class="grow"><b>${esc(c.nome)}</b><br><span class="mut small">${esc(c.mat)}</span></span></label>`).join('')}</div></div>`;
  document.body.appendChild(ov);
  ov.onclick = e => {
    if(e.target===ov||e.target.closest('[data-x]')){ ov.remove(); return; }
    if(e.target.closest('[data-ok]')){ const ms=[...ov.querySelectorAll('input:checked')].map(i=>i.value); ov.remove(); cb(sortEq(ms.map(m=>({m,n:colabByMat(m).nome})))); return; }
    const lab = e.target.closest('label'); if(lab) setTimeout(()=>lab.classList.toggle('on', lab.querySelector('input').checked),0);
  };
}

/* ============ INÍCIO ============ */
S.sel = S.sel.filter(id => osById(id));
if(apiOk() && !getAuth()) showLogin(); else render();
window.addEventListener('online', ()=>{ const n=$('#net'); if(n) n.style.display='none'; verificar(true); });
window.addEventListener('offline', ()=>{ const n=$('#net'); if(n) n.style.display=''; });
if(navigator.onLine && (!apiOk() || getAuth())) verificar(true);
</script>
